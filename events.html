<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Tracker</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1c1b1a;--muted:#6f6b66;--line:#e6e1da;--accent:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--card:#201f1d;--text:#f0ece6;--muted:#9a948b;--line:#33312e;--accent:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:.9rem}
.box,.event{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;font-family:system-ui,sans-serif;font-size:.95rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.row input{flex:1;min-width:180px;width:auto}
button{font-family:system-ui,sans-serif;font-size:.9rem;border:0;border-radius:6px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
label{display:block;font:600 .75rem system-ui,sans-serif;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
#msg{font:.85rem system-ui,sans-serif;color:var(--muted);margin-top:8px;min-height:1.2em}
#form{display:none}
.date{font:600 .8rem system-ui,sans-serif;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.event h3{margin:2px 0 2px;font-size:1.25rem}
.event .venue{font:.85rem system-ui,sans-serif;color:var(--muted)}
.event p{margin:8px 0;white-space:pre-wrap}
.event a{color:var(--accent);font:.85rem system-ui,sans-serif}
.actions{display:flex;gap:8px;margin-top:8px}
.tools{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<main>
<h1>Event Tracker</h1>
<p class="sub">Paste an event link, check the details, save. Newest dates first.</p>

<div class="box">
  <div class="row">
    <input id="url" type="url" placeholder="https://example.com/event-page">
    <button id="fetchBtn">Fetch details</button>
  </div>
  <div id="msg"></div>
  <div id="form">
    <label>Title</label><input id="title">
    <label>Date</label><input id="date" type="date">
    <label>Venue / source</label><input id="venue">
    <label>Summary</label><textarea id="summary" rows="3"></textarea>
    <div class="actions"><button id="saveBtn">Save event</button><button class="ghost" id="cancelBtn">Cancel</button></div>
  </div>
</div>

<div id="list"></div>

<div class="tools">
  <button class="ghost" id="exportBtn">Export JSON</button>
  <button class="ghost" id="importBtn">Import JSON</button>
  <input type="file" id="importFile" accept=".json" hidden>
</div>
</main>

<script>
const KEY='eventTracker.v1';
const $=id=>document.getElementById(id);
let events=[];
try{events=JSON.parse(localStorage.getItem(KEY)||'null')||[]}catch(e){}
if(!events.length){ // seed with the sample link
  events=[{id:'seed',url:'https://buttonfactory.ie/shows/2026/12/6/tr-phidn',title:'Show at The Button Factory (edit title)',date:'2026-12-06',venue:'The Button Factory, Temple Bar, Dublin',summary:'Sample entry. The site blocked automatic reading, so the date and venue come from the URL. Edit to add the act and details.'}];
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let editing=null;

function render(){
  const sorted=[...events].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  $('list').innerHTML=sorted.length?sorted.map(e=>{
    const d=e.date?new Date(e.date+'T12:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'long',year:'numeric'}):'Date unknown';
    return `<div class="event"><div class="date">${d}</div><h3>${esc(e.title)}</h3>
    <div class="venue">${esc(e.venue)}</div><p>${esc(e.summary)}</p>
    <a href="${esc(e.url)}" target="_blank" rel="noopener">Event page ↗</a>
    <div class="actions"><button class="ghost" onclick="edit('${e.id}')">Edit</button><button class="ghost" onclick="del('${e.id}')">Delete</button></div></div>`}).join(''):'<div class="empty">No events yet.</div>';
}
function del(id){if(confirm('Delete this event?')){events=events.filter(e=>e.id!==id);save();render()}}
function edit(id){const e=events.find(x=>x.id===id);editing=id;$('url').value=e.url;
  ['title','date','venue','summary'].forEach(k=>$(k).value=e[k]||'');$('form').style.display='block';scrollTo({top:0,behavior:'smooth'})}

function fromUrl(u){
  const m=u.match(/(20\d\d)[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
}
async function getHtml(u){
  const proxies=[x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://corsproxy.io/?'+encodeURIComponent(x)];
  for(const p of proxies){
    try{const r=await fetch(p(u));if(r.ok){const t=await r.text();if(t.length>200)return t}}catch(e){}
  }
  return null;
}
$('fetchBtn').onclick=async()=>{
  const u=$('url').value.trim();
  if(!/^https?:\/\//.test(u)){$('msg').textContent='Please enter a full URL starting with http(s)://';return}
  $('msg').textContent='Fetching…';editing=null;
  const host=new URL(u).hostname.replace(/^www\./,'');
  let t='',desc='',date=fromUrl(u),venue=host,site='';
  const html=await getHtml(u);
  if(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const meta=n=>(doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)||{}).content||'';
    t=meta('og:title')||doc.title||'';
    desc=meta('og:description')||meta('description');
    site=meta('og:site_name');
    doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{
      try{const j=JSON.parse(s.textContent);(Array.isArray(j)?j:[j]).forEach(o=>{
        if(o&&o.startDate&&!date)date=String(o.startDate).slice(0,10);
        if(o&&o.location&&o.location.name)venue=o.location.name;
      })}catch(e){}
    });
    if(site&&venue===host)venue=site;
    $('msg').textContent='Details fetched. Check and edit anything before saving.';
  }else $('msg').textContent='Could not read that page automatically. Date was guessed from the URL where possible; please fill in the rest.';
  $('title').value=t.trim();$('date').value=date;$('venue').value=venue;$('summary').value=desc.trim();
  $('form').style.display='block';
};
$('cancelBtn').onclick=()=>{$('form').style.display='none';$('msg').textContent='';editing=null};
$('saveBtn').onclick=()=>{
  const rec={url:$('url').value.trim(),title:$('title').value.trim()||'Untitled event',date:$('date').value,venue:$('venue').value.trim(),summary:$('summary').value.trim()};
  if(editing)events=events.map(e=>e.id===editing?{...e,...rec}:e);
  else events.push({id:String(Date.now()),...rec});
  save();render();$('form').style.display='none';$('url').value='';$('msg').textContent='Saved.';editing=null;
};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));a.download='events.json';a.click()};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(Array.isArray(d)){events=d;save();render()}}catch(x){alert('Invalid file')}};
render();
</script>
</body>
</html>
